<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公式管理系统</title>
    <link rel="stylesheet" href="css/formula.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>公式管理系统</h1>
            <div class="header-actions">
                <button id="btn-health" class="btn">检查引擎状态</button>
                <button id="btn-refresh" class="btn btn-primary">刷新列表</button>
            </div>
        </header>

        <div class="main-content">
            <!-- 左侧：公式列表 -->
            <div class="panel panel-left">
                <div class="panel-header">
                    <h2>公式列表</h2>
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="搜索公式名称...">
                        <select id="filter-category">
                            <option value="">全部分类</option>
                            <option value="indicator">指标公式</option>
                            <option value="xg">选股公式</option>
                            <option value="exp">专家系统</option>
                        </select>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="formula-list" class="formula-list"></div>
                </div>
                <div class="panel-footer">
                    <button id="btn-create" class="btn btn-success">新建公式</button>
                </div>
            </div>

            <!-- 右侧：公式编辑器 -->
            <div class="panel panel-right">
                <div class="panel-header">
                    <h2 id="editor-title">公式编辑器</h2>
                    <div class="editor-actions">
                        <button id="btn-save" class="btn btn-primary">保存</button>
                        <button id="btn-test" class="btn btn-warning">测试</button>
                        <button id="btn-delete" class="btn btn-danger">删除</button>
                    </div>
                </div>
                <div class="panel-content">
                    <form id="formula-form">
                        <div class="form-group">
                            <label for="formula-name">公式名称</label>
                            <input type="text" id="formula-name" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="formula-category">分类</label>
                                <select id="formula-category" required>
                                    <option value="indicator">指标公式</option>
                                    <option value="xg">选股公式</option>
                                    <option value="exp">专家系统</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="formula-type">类型</label>
                                <select id="formula-type" required>
                                    <option value="indicator">指标</option>
                                    <option value="xg">选股</option>
                                    <option value="exp">专家系统</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="formula-description">描述</label>
                            <textarea id="formula-description" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="formula-script">公式脚本</label>
                            <textarea id="formula-script" rows="10" class="code-editor" required></textarea>
                            <small class="form-text">使用 TDX/DZH 公式语法，每条语句以分号结尾</small>
                        </div>
                        <div class="form-group">
                            <label>参数列表</label>
                            <div id="formula-args" class="args-container"></div>
                            <button type="button" id="btn-add-arg" class="btn btn-sm">添加参数</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 测试结果面板 -->
        <div id="test-result-panel" class="test-result-panel hidden">
            <div class="panel-header">
                <h2>测试结果</h2>
                <button id="btn-close-test" class="btn btn-sm">关闭</button>
            </div>
            <div class="panel-content">
                <div id="test-result-content"></div>
            </div>
        </div>
    </div>

    <!-- 测试对话框 -->
    <div id="test-dialog" class="dialog hidden">
        <div class="dialog-content">
            <div class="dialog-header">
                <h3>测试公式</h3>
                <button class="btn-close" onclick="closeTestDialog()">×</button>
            </div>
            <div class="dialog-body">
                <div class="form-group">
                    <label for="test-stock-code">股票代码</label>
                    <input type="text" id="test-stock-code" value="000001" placeholder="如：000001">
                </div>
                <div class="form-group">
                    <label for="test-period">周期</label>
                    <select id="test-period">
                        <option value="1d">日线</option>
                        <option value="1wk">周线</option>
                        <option value="1mon">月线</option>
                        <option value="1m">1分钟</option>
                        <option value="5m">5分钟</option>
                        <option value="15m">15分钟</option>
                        <option value="30m">30分钟</option>
                        <option value="60m">60分钟</option>
                    </select>
                </div>
                <div id="test-xg-stocks" class="form-group hidden">
                    <label for="test-stock-list">股票列表（选股公式）</label>
                    <textarea id="test-stock-list" rows="3" placeholder="每行一个股票代码，如：&#10;000001&#10;000002&#10;600000"></textarea>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn" onclick="closeTestDialog()">取消</button>
                <button class="btn btn-primary" onclick="executeTest()">执行测试</button>
            </div>
        </div>
    </div>

    <script src="js/formula-manager.js?v=2"></script>
</body>
</html>
